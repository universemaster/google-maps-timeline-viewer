            setHead(["Activity place", "Type", "Events", "Directions", "Searches", "Views", "First", "Last", "Sources"]);
            setRows(rows.slice(0, 1500).map(place => `
                <tr data-lat="${place.lat}" data-lng="${place.lng}" data-title="${escapeHtml(place.label)}">
                    <td><div class="place-name">${escapeHtml(place.label)}</div><div class="subtle">${place.lat}, ${place.lng}</div></td>
                    <td><span class="pill ${placeClass(place)}">${placeLabel(place)}</span></td>
                    <td class="num">${formatNumber(place.activityCount)}</td>
                    <td class="num">${formatNumber((place.directionsCount || 0) + (place.navigationCount || 0))}</td>
                    <td class="num">${formatNumber(place.searchCount)}</td>
                    <td class="num">${formatNumber(place.placeViewCount)}</td>
                    <td>${place.firstSeen || ""}</td>
                    <td>${place.lastSeen || ""}</td>
                    <td class="num">${formatNumber(place.sourceCount)}</td>
                </tr>
            `));
            renderMarkers(rows, "activityPlaces");
        }

        function renderActivities() {
            const rows = filterActivities();
            setHead(["Time", "Activity", "Place", "Type", "Sources", "Lat", "Lng"]);
            setRows(rows.slice(0, 2000).map(activity => `
                <tr ${activity.hasCoordinates ? `data-lat="${activity.lat}" data-lng="${activity.lng}"` : ""} data-title="${escapeHtml(activity.locationName || activity.title)}">
                    <td>${activity.timeUtc ? activity.timeUtc.replace("T", " ").replace("Z", "") : ""}</td>
                    <td><div class="place-name">${escapeHtml(activity.title)}</div><div class="subtle">${escapeHtml(activity.activityKind)}</div></td>
                    <td><div class="place-name">${escapeHtml(activity.placeLabel || activity.locationName)}</div></td>
                    <td><span class="pill ${placeClass(activity)}">${placeLabel(activity)}</span></td>
                    <td class="num">${formatNumber(activity.sourceCount)}</td>
                    <td>${activity.lat ?? ""}</td>
                    <td>${activity.lng ?? ""}</td>
                </tr>
            `));
            renderMarkers(rows, "activities");
        }

        function renderYears() {
            setHead(["Year", "Known nights", "Away nights", "Home nights", "Away places", "Visits", "Map activity"]);
            setRows(data.yearSummary.map(row => `
                <tr>
                    <td>${row.year}</td>
                    <td class="num">${formatNumber(row.knownNights)}</td>
                    <td class="num">${formatNumber(row.awayNights)}</td>
                    <td class="num">${formatNumber(row.homeNights)}</td>
                    <td class="num">${formatNumber(row.awayPlaces)}</td>
                    <td class="num">${formatNumber(row.visitCount)}</td>
                    <td class="num">${formatNumber(row.mapActivityCount)}</td>
                </tr>
            `));
            renderMarkers(filterPlaces(), "years");
        }

        function renderSources() {
            const rows = filterSources();
            setHead(["Source", "Status", "Raw records", "Unique added", "Duplicates", "Mapped", "Date range"]);
            setRows(rows.map(source => `
                <tr>
                    <td><div class="place-name">${escapeHtml(basename(source.sourceFile))}</div><div class="subtle">${escapeHtml(source.member || source.sourceFile)}</div></td>
                    <td>${escapeHtml(source.status)}</td>
                    <td class="num">${formatNumber(source.rawRecords)}</td>
                    <td class="num">${formatNumber(source.uniqueRecordsAdded)}</td>
                    <td class="num">${formatNumber(source.duplicateRecords)}</td>
                    <td class="num">${formatNumber(source.mappedRecords)}</td>
                    <td>${source.dateMin ? `${source.dateMin.slice(0, 10)} to ${source.dateMax.slice(0, 10)}` : ""}</td>
                </tr>
            `));
            renderMarkers(filterActivityPlaces(), "sources");
        }

        function setHead(labels) {
            document.getElementById("tableHead").innerHTML = `<tr>${labels.map(label => `<th>${label}</th>`).join("")}</tr>`;
        }

        function setRows(markup) {
            const body = document.getElementById("tableBody");
            body.innerHTML = markup.join("");
            body.querySelectorAll("tr[data-lat]").forEach(row => {
                row.classList.toggle("selected", row.dataset.placeId === state.selectedPlaceId);
                row.addEventListener("click", () => {
                    const lat = Number(row.dataset.lat);
                    const lng = Number(row.dataset.lng);
                    if (row.dataset.placeId) selectPlace(row.dataset.placeId);
                    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
                    state.map.setView([lat, lng], 14);
                });
            });
        }

        function markerRadius(item, mode) {
            if (mode === "places") return Math.max(5, Math.min(18, 5 + Math.sqrt((item.visitCount || 0) + (item.overnightCount || 0))));
            if (mode === "activityPlaces") return Math.max(5, Math.min(18, 4 + Math.sqrt(item.activityCount || 0)));
            if (mode === "activities") return Math.max(5, Math.min(12, 4 + Math.sqrt(item.activityCount || 1)));
            return item.isHome ? 7 : 8;
        }

        function markerColor(item) {
            if (item.isHome) return "#1f7a5c";
            if (item.isWork) return "#2f6fbd";
            if (item.activityKind === "directions" || item.activityKind === "navigation") return "#2f6fbd";
            if (item.activityKind === "search") return "#b76619";
            if ((item.activityCount || 0) > 0 || item.activityPlaceId) return "#347f83";
            return item.awayOvernightCount || item.source?.includes("overnight") || item.nightDate ? "#b73535" : "#b76619";
        }

        function renderMarkers(items, mode) {
            state.layer.clearLayers();
            const markerItems = mode === "overnights" || mode === "visits" || mode === "activities" ? compactByPlace(items, mode) : items;
            const bounds = [];
            markerItems.slice(0, 1200).forEach(item => {
                if (!Number.isFinite(item.lat) || !Number.isFinite(item.lng)) return;
                const marker = L.circleMarker([item.lat, item.lng], {
                    radius: markerRadius(item, mode),
                    weight: 1,
                    color: markerColor(item),
                    fillColor: markerColor(item),
                    fillOpacity: 0.72,
                }).addTo(state.layer);
                const markerPlaceId = item.id || item.placeId || item.confirmedPlaceId;
                if (placesById.has(markerPlaceId)) {
                    marker.on("click", () => selectPlace(markerPlaceId));
                }
                marker.bindPopup(`
                    <div class="popup-title">${escapeHtml(item.label || item.placeLabel)}</div>
                    <div>${item.isHome ? "Home" : item.isWork ? "Work" : "Away"}${item.visitCount !== undefined ? ` · ${formatNumber(item.visitCount)} visits` : ""}${item.activityCount !== undefined ? ` · ${formatNumber(item.activityCount)} activity` : ""}</div>
                    <div>${item.overnightCount !== undefined ? `${formatNumber(item.overnightCount)} nights` : item.nightDate || item.startUtc || item.timeUtc || ""}</div>
                    <div class="subtle">${item.lat}, ${item.lng}</div>
                `);
                bounds.push([item.lat, item.lng]);
            });
            document.getElementById("mapStatus").textContent = `${formatNumber(items.length)} rows, ${formatNumber(markerItems.length)} mapped places`;
            if (bounds.length) state.map.fitBounds(bounds, { padding: [28, 28], maxZoom: 11 });
        }

        function compactByPlace(items, mode) {
            const map = new Map();
            items.forEach(item => {
                if (item.lat === null || item.lng === null || item.lat === undefined || item.lng === undefined) return;
                const key = item.activityPlaceId || item.placeId || `${item.lat},${item.lng}`;
                const place = placesById.get(item.placeId);
                const activityPlace = activityPlacesById.get(item.activityPlaceId);
                if (!map.has(key)) {
                    map.set(key, {
                        ...item,
                        label: activityPlace?.label || place?.label || item.placeLabel || item.locationName || item.title,
                        lat: activityPlace?.lat ?? item.lat,
                        lng: activityPlace?.lng ?? item.lng,
                        isHome: activityPlace?.isHome ?? item.isHome,
                        isWork: activityPlace?.isWork ?? place?.isWork ?? false,
                        visitCount: 0,
                        overnightCount: 0,
                        awayOvernightCount: 0,
                        activityCount: mode === "activities" ? 0 : undefined,
                    });
                }
                const row = map.get(key);
                if (item.nightDate) row.overnightCount += 1;
                if (item.nightDate && !item.isHome) row.awayOvernightCount += 1;
                if (item.startUtc) row.visitCount += 1;
                if (mode === "activities") row.activityCount += 1;
            });
            return Array.from(map.values());
        }

        if (!data) {
            document.body.innerHTML = "<p style='padding: 24px'>Missing places_dashboard_data.js. Run build_places_dashboard_data.py first.</p>";
        } else {
            init();
        }
    </script>
</body>
</html>
